[project]
name = "agent-tools-workspace"
version = "0.1.0"
description = "Development workspace for the framework-agnostic Agent-Tools packages"
requires-python = ">=3.11"
dependencies = [
    "agent-tools-core",
    "agent-tools-fs",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<10",
    "ruff>=0.9,<1",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
agent-tools-core = { workspace = true }
agent-tools-fs = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
