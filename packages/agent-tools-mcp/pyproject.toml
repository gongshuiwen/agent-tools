[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-tools-mcp"
version = "0.3.0"
description = "Expose remote MCP Tools via Agent-Tools's unified Tool interface"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["agent-tools-core>=0.3,<0.4", "mcp>=2.1,<3", "jsonschema>=4.22,<5"]

[tool.setuptools.packages.find]
where = ["src"]
